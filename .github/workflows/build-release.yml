name: Build OpenWrt Package
permissions:
  contents: write

on:
  push:
    branches:
      - master
    paths:
      - 'Makefile'
      - '!**/.github/**'
  workflow_dispatch:

jobs:
  check:
    name: 1. Check if build is required
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check_release.outputs.should_build }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      main_version: ${{ steps.version.outputs.main_version }}
      main_full_version: ${{ steps.version.outputs.main_full_version }}
    steps:
      - name: 🧾 Checkout repo
        uses: actions/checkout@v6

      - name: 🏷️ Extract version info from Date
        id: version
        run: |
          set -euo pipefail
          PKG_VERSION=$(date -u +'%y.%j')
          PKG_RELEASE=$(date -u +'%s' | cut -c6-10)
          COMBINED_VERSION="v${PKG_VERSION}-r${PKG_RELEASE}"
          
          echo "tag_name=${COMBINED_VERSION}" >> "$GITHUB_OUTPUT"
          echo "main_version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "main_full_version=$COMBINED_VERSION" >> "$GITHUB_OUTPUT"
                  
      - name: 🧐 Check if release exists
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag_name }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Manual run detected. Forcing build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists. Skipping build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG does not exist. Proceeding with build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build for ${{ matrix.version }} / ${{ matrix.target }}
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.patch_version.outputs.version }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - version: openwrt-25.12
            target: x86_64
            suffix: noarch

    steps:
      - name: 🧾 Checkout repo
        uses: actions/checkout@v6

      - name: 📛 Set PKG_NAME from repo
        run: echo "PKG_NAME=${{ github.event.repository.name }}" >> "$GITHUB_ENV"

      - name: 🧰 Set up muink feed structure
        run: |
          set -e
          mkdir -p package
          printf 'include $(TOPDIR)/feeds/luci/luci.mk\n' > package/luci.mk
          mkdir -p feed/luci/applications/${PKG_NAME}
          mkdir -p feed/luci
          printf 'include $(TOPDIR)/feeds/luci/luci.mk\n' > feed/luci/luci.mk
          rsync -av \
            --exclude='.git' \
            --exclude='feed' \
            --exclude='.github' \
            ./ feed/luci/applications/${PKG_NAME}/

      - name: 🩹 Patch Makefile with dynamic version
        id: patch_version
        run: |
          set -euo pipefail
          PKG_VERSION=$(date -u +'%y.%j')
          PKG_RELEASE=$(date -u +'%s' | cut -c6-10)
          echo "Using version: ${PKG_VERSION}-r${PKG_RELEASE}"
          MF="feed/luci/applications/${PKG_NAME}/Makefile"
          sed -i '/^PKG_VERSION/d' "$MF"
          sed -i '/^PKG_RELEASE/d' "$MF"
          sed -i "/^LUCI_NAME/a PKG_RELEASE:=${PKG_RELEASE}" "$MF"
          sed -i "/^LUCI_NAME/a PKG_VERSION:=${PKG_VERSION}" "$MF"
          echo "version=v${PKG_VERSION}-r${PKG_RELEASE}" >> $GITHUB_OUTPUT
          
      - name: 🧮 Compute ARCH
        run: echo "ARCH=${{ matrix.target }}-${{ matrix.version }}" >> "$GITHUB_ENV"

      - name: 🏗️ Build with OpenWrt SDK
        uses: openwrt/gh-action-sdk@v11
        env:
          ARCH: ${{ env.ARCH }}
          FEEDNAME: muink
          PACKAGES: ${{ env.PKG_NAME }}
          INDEX: 0
          FEED_DIR: ${{ github.workspace }}/feed
          NO_SHFMT_CHECK: 1
          NO_REFRESH_CHECK: 1
          
      - name: 📦 Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PKG_NAME }}-${{ matrix.target }}-${{ matrix.version }}
          path: bin/packages/*/muink/${{ env.PKG_NAME }}*.apk
          if-no-files-found: ignore

  release:
    name: Release ${{ github.repository }}
    needs: [check, build]
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout repo
        uses: actions/checkout@v6

      - name: ⬇️ Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./release-assets

      - name: 🗃️ Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name: Build-${{ needs.build.outputs.version }}
          files: ./release-assets/**/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔑 Checkout custom-packages repo
        uses: actions/checkout@v6
        with:
          repository: OneNAS-space/custom-packages
          token: ${{ secrets.CUSTOM_PACKAGES_TOKEN }}
          path: custom-packages

      - name: 🚚 Update luci artifacts
        run: |
          set -e
          CURRENT_PKG="${{ github.event.repository.name }}"
          TARGET_DIR="custom-packages/releases/packages-25.12/luci"
          mkdir -p "$TARGET_DIR"
          
          echo "Cleaning old versions in $TARGET_DIR..."
          rm -f "$TARGET_DIR/${CURRENT_PKG}"-*.apk
          
          find ./release-assets -type f -name "*.apk" | while read -r f; do
            echo "Deploying $(basename "$f")"
            cp "$f" "$TARGET_DIR/"
          done
          
          cd custom-packages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "releases/packages-25.12/luci/"
          git commit -m "Update $CURRENT_PKG to ${{ needs.build.outputs.version }}" || echo "No changes"
          
          for i in {1..5}; do
            git pull --rebase origin main && git push origin main && break || (echo "Retry $i" && sleep 5)
          done
